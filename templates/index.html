<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VideoDownloader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>VideoDownloader Web</h1>
<form method="POST">
    <input type="text" name="url" placeholder="Ingresa URL del video">
    <button type="submit">Agregar a la cola</button>
    <button name="start" value="1">Iniciar descargas</button>
</form>

<h2>Cola de descargas:</h2>
<ul>
{% for url in queue %}
    <li>{{ url }}</li>
{% endfor %}
</ul>
</body>
</html>
